[settings]
# Node comes from mise: the global version below, a project's from its .nvmrc.
idiomatic_version_file_enable_tools = ["node"]
[settings.ruby]
compile = false
[settings.github]
# Private repos (ilmeskio/ai-profiles) download with the gh login.
credential_command = "gh auth token"

[tools]
node = "26"
ruby = "latest"
# ai-profile and ai-secrets, from the releases of ilmeskio/ai-profiles.
"github:ilmeskio/ai-profiles" = "0.1.3"
# Bitwarden CLIs as native binaries: bw (used by ai-secrets) does not depend on
# the node of the current folder.
"github:bitwarden/clients" = { version = "2026.10.0", version_prefix = "cli-v", bin = "bw" }
"github:bitwarden/sdk-sm" = { version = "2.1.0", version_prefix = "bws-v", bin = "bws" }
