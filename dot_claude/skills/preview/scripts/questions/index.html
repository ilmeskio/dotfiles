<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domande</title>
<style>
:root {
  --bg: #f6f7f8; --surface: #ffffff; --fg: #1d2329; --muted: #5d6873; --line: #dde2e7;
  --accent: #2a5d8f; --accent-soft: #e4edf6; --ok: #2f7a4f; --ok-soft: #e3f2e8; --warn: #9a5b12;
  --font: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14181c; --surface: #1c2127; --fg: #e3e8ec; --muted: #98a3ad; --line: #2e353d;
    --accent: #7fb0e0; --accent-soft: #1f3247; --ok: #7cc79a; --ok-soft: #1b3326; --warn: #e6b06a; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); }
main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.top h1 { font-size: 16px; margin: 0; }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots button { width: 26px; height: 26px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 12px var(--mono); cursor: pointer; }
.dots button.done { background: var(--ok-soft); border-color: var(--ok); }
.dots button[aria-current="true"] { outline: 2px solid var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.meta { font: 12px var(--mono); color: var(--muted); }
.card h2 { margin: 0; font-size: 18px; line-height: 1.35; text-wrap: balance; }
.ctx { margin: 0; color: var(--muted); font-size: 14px; }
.ctx b { color: var(--fg); }
.opts { display: grid; gap: 6px; }
.opts label { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.opts label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opts input { margin-top: 4px; }
textarea { width: 100%; min-height: 70px; font: 14px/1.45 var(--font); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.send { font: 600 14px var(--font); background: var(--accent); color: var(--surface); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
.nav { font: 14px var(--font); background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.saved { font-size: 13px; color: var(--muted); }
.reply { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 14px; }
.reply b { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); display: block; }
.offline { color: var(--warn); font-size: 13px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="title">Domande</h1><span class="offline" id="offline" hidden>server non raggiungibile</span><div class="dots" id="dots"></div></div>
  <div id="card"></div>
</main>
<script>
let Q = [];
let state = { answers: {}, replies: {} };
let cur = 0;
const drafts = {};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  document.getElementById('dots').innerHTML = Q.map((q, i) =>
    `<button type="button" data-go="${i}" class="${state.answers[q.id] ? 'done' : ''}" aria-current="${i === cur}" aria-label="Domanda ${i + 1}">${i + 1}</button>`).join('');
  const q = Q[cur], a = state.answers[q.id], d = drafts[q.id] || {};
  const choice = d.choice ?? a?.choice ?? null, note = d.note ?? a?.note ?? '', r = state.replies[q.id];
  document.getElementById('card').innerHTML = `<section class="card">
    <div class="meta">${cur + 1} di ${Q.length}${q.who ? ' · ' + esc(q.who) : ''}</div>
    <h2>${esc(q.q)}</h2>${q.context ? `<p class="ctx">${q.context}</p>` : ''}
    <div class="opts">${(q.options || []).map((o, i) => `<label><input type="radio" name="r" id="r-${q.id}-${i}" value="${esc(o)}" ${choice === o ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>
    <textarea id="note" placeholder="La tua risposta, o una nota">${esc(note)}</textarea>
    <div class="actions">
      <button class="nav" type="button" data-go="${cur - 1}" ${cur === 0 ? 'disabled' : ''}>Precedente</button>
      <button class="send" type="button" id="send">${a ? 'Reinvia' : 'Invia'} e vai avanti</button>
      <span class="saved" id="saved">${a ? 'inviata' : ''}</span>
    </div>
    ${r ? `<div class="reply"><b>Claude</b>${esc(r.text || r)}</div>` : ''}
  </section>`;
}
document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { cur = Math.max(0, Math.min(Q.length - 1, Number(g.dataset.go))); render(); return; }
  if (e.target.id !== 'send') return;
  const q = Q[cur];
  const choice = document.querySelector('input[name="r"]:checked')?.value ?? null;
  const note = document.getElementById('note').value.trim();
  if (!choice && !note) { document.getElementById('saved').textContent = 'Scegli un’opzione o scrivi una risposta'; return; }
  try {
    const res = await fetch('/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: q.id, choice, note }) });
    const j = await res.json(); if (!j.ok) throw new Error(j.error);
    state.answers[q.id] = { choice, note, at: j.at }; delete drafts[q.id];
    const next = Q.findIndex((x, i) => i > cur && !state.answers[x.id]);
    if (next >= 0) cur = next;
    render();
  } catch { document.getElementById('saved').textContent = 'Invio non riuscito: il server locale è acceso?'; }
});
document.addEventListener('input', (e) => {
  const id = Q[cur].id; drafts[id] = drafts[id] || {};
  if (e.target.name === 'r') drafts[id].choice = e.target.value; else if (e.target.id === 'note') drafts[id].note = e.target.value;
});
async function poll() {
  try {
    const next = await (await fetch('/state', { cache: 'no-store' })).json();
    document.getElementById('offline').hidden = true;
    const changed = JSON.stringify(next) !== JSON.stringify(state); state = next;
    if (changed && document.activeElement?.id !== 'note') render();
  } catch { document.getElementById('offline').hidden = false; }
}
fetch('/questions.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
  Q = d.questions || []; if (d.title) { document.getElementById('title').textContent = d.title; document.title = d.title; }
  render(); poll(); setInterval(poll, 4000);
});
</script>
</body>
</html>
